; PlatformIO Project Configuration File
; Elecrow CrowPanel 7" ESP32-S3 HMI V3.0 - Wireless Text Display (LVGL)
; Hardware: ESP32-S3-WROOM-1-N4R8 (4MB Flash + 8MB PSRAM), 800x480 RGB, GT911 via PCA9557

[platformio]
default_envs = crowpanel_7

[env:crowpanel_7]
platform = espressif32@6.9.0
board = esp32-s3-devkitc1-n4r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -I src

lib_deps =
    lovyan03/LovyanGFX@1.1.12
    lvgl/lvgl@8.3.11
; TAMC_GT911 is vendored in lib/ (patched: skips reset pin ops when no
; direct GPIO is wired - the V3 panel resets the GT911 via PCA9557 expander)
