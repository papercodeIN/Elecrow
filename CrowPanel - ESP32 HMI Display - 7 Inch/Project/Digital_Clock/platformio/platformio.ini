; PlatformIO Project Configuration File
; Elecrow CrowPanel 7" ESP32-S3 HMI - Digital Clock (LVGL)
; Hardware: ESP32-S3, 800x480 RGB panel, GT911 touch

[env:esp32s3]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 with 8MB flash / 8MB PSRAM (CrowPanel 7")
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default.csv
board_upload.flash_size = 4MB

; TAMC_GT911 is vendored in lib/TAMC_GT911 with a reset() guard for pins
; tied to the PCA9557 expander (upstream lib spams GPIO errors for pin -1)
lib_deps =
    lovyan03/LovyanGFX@1.1.12
    lvgl/lvgl@8.3.11

build_flags =
    ; CDC on boot must stay OFF: the S3's native USB pins (19/20) are wired to
    ; touch I2C on this board, so Serial must map to UART0 (the COM11 bridge)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

