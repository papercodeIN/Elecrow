[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=600000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    me-no-dev/ESPAsyncWebServer@1.2.3
    me-no-dev/AsyncTCP@1.1.1
    bodmer/TJpg_Decoder@1.1.0
    kikuchan98/pngle@1.1.0

[env:esp32s3_7inch]
platform = espressif32@6.9.0
board = esp32-s3-devkitc1-n4r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep
; Board definition supplies 4 MB flash, qio_opi, and the required OPI PSRAM boot setup.
board_upload.flash_size = 4MB
build_flags =
    -DDISPLAY_BACKEND_LOVYANGFX=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bodmer/TJpg_Decoder@1.1.0
    kikuchan98/pngle@1.1.0
    ESP32Async/ESPAsyncWebServer@3.6.0
    ESP32Async/AsyncTCP@3.3.2

