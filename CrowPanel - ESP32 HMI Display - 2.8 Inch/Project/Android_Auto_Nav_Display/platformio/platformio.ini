; Android Auto-style Turn-by-Turn Navigation Display
; Elecrow CrowPanel 2.8" ESP32 CYD (ESP32-WROOM-32-N4, ILI9341V, resistive touch)
;
; TFT pin configuration is compile-time (TFT_eSPI) and lives in build_flags,
; matching the proven Digital_Clock project config for this board.
; Do NOT copy a User_Setup.h into the TFT_eSPI library when using this project.

[env:crowpanel_28]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

lib_deps =
    bodmer/TFT_eSPI@2.5.0
    bblanchon/ArduinoJson@6.21.5

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTOUCH_CS=33
    -DSPI_FREQUENCY=16000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=600000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -Iinclude
