; PlatformIO Project Configuration File
; Elecrow 2.8" ESP32 CYD - Army Digital Clock
; Required versions per Elecrow: ESP32 Arduino core 2.0.14, TFT_eSPI 2.5.0

[env:esp32dev]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.0
    paulstoffregen/Time@^1.6.1

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
