<!DOCTYPE HTML>
<html>
<head>
<title>Info Display Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:20px;background-color:#f0f0f0}
.content{max-width:800px;margin:auto;background:white;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1)}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-weight:bold}
input[type=text]{width:calc(100% - 180px);padding:8px;margin-bottom:0;border:1px solid #ddd;border-radius:4px}
select{width:100px;padding:8px;border:1px solid #ddd;border-radius:4px;margin:0 5px}
button{background-color:#4CAF50;color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer}
button:hover{background-color:#45a049}
.preview-container{width:400px;height:300px;margin:20px auto;position:relative}
.preview{width:400px;height:300px;position:relative;border:1px solid #000;background:white;overflow:hidden;transition:all 0.3s ease}
.preview.inverted{background:black;color:white}
.preview-row{position:absolute;left:10px;right:10px;white-space:nowrap;overflow:hidden;font-family:monospace}
.error{color:red;display:none;margin-top:5px}
.row-container{margin-bottom:10px}
.row-group{display:grid;grid-template-columns:auto 110px 60px;gap:5px;margin-bottom:5px;align-items:center}
.del-btn{background-color:#ff4444;padding:8px;font-size:12px;height:35px;margin:0;width:100%}
.color-options{display:flex;gap:10px;margin-bottom:15px}
.color-btn{padding:10px 20px;border:2px solid #ddd;border-radius:4px;cursor:pointer;transition:all 0.3s ease}
.color-btn.normal{background:white;color:black}
.color-btn.inverted{background:black;color:white}
.color-btn.selected{border-color:#4CAF50}
</style>
<script>
const rowHeights={12:32,18:40,24:48};
function calculateRowPositions(){let positions=[];let currentY=10;for(let i=0;i<8;i++){const fontSize=parseInt(document.getElementById(`fontSize${i}`).value);const height=rowHeights[fontSize];positions.push({y:currentY,height:height});currentY+=height;}return positions;}
function updatePreview(){const preview=document.querySelector('.preview');preview.innerHTML='';const positions=calculateRowPositions();for(let i=0;i<8;i++){const text=document.getElementById(`row${i}`).value;const fontSize=document.getElementById(`fontSize${i}`).value;if(text){const rowDiv=document.createElement('div');rowDiv.className='preview-row';const textSpan=document.createElement('span');textSpan.innerHTML=text.replace(/ /g,'&nbsp;');textSpan.style.letterSpacing=`${fontSize*0.65}px`;rowDiv.appendChild(textSpan);rowDiv.style.top=`${positions[i].y}px`;rowDiv.style.fontSize=`${fontSize}px`;preview.appendChild(rowDiv);}}}
function toggleColors(inverted){const preview=document.querySelector('.preview');preview.className=inverted?'preview inverted':'preview';document.querySelector('.color-btn.normal').className='color-btn normal'+(!inverted?' selected':'');document.querySelector('.color-btn.inverted').className='color-btn inverted'+(inverted?' selected':'');}
function clearRow(index){document.getElementById(`row${index}`).value='';updatePreview();}
function submitForm(){const rows=[];for(let i=0;i<8;i++){rows.push({text:document.getElementById(`row${i}`).value,fontSize:parseInt(document.getElementById(`fontSize${i}`).value)});}const formData={rows:rows,border:document.getElementById('border').checked,invertColors:document.querySelector('.preview').classList.contains('inverted')};fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)}).then(response=>{if(response.ok){alert('Display updated successfully!');}});return false;}
window.onload=function(){updatePreview();fetch('/api/status').then(r=>r.json()).then(data=>{if(data.rows){for(let i=0;i<data.rows.length&&i<8;i++){document.getElementById(`row${i}`).value=data.rows[i].text||'';document.getElementById(`fontSize${i}`).value=data.rows[i].fontSize||18;}}if(data.border)document.getElementById('border').checked=data.border;if(data.invertColors)toggleColors(true);updatePreview();}).catch(()=>{});};
</script>
</head>
<body>
<div class="content">
<h1>Info Display Control</h1>
<form onsubmit="return submitForm()">
<div class="form-group">
<label>Display Colors:</label>
<div class="color-options">
<div class="color-btn normal selected" onclick="toggleColors(false)">Black on White</div>
<div class="color-btn inverted" onclick="toggleColors(true)">White on Black</div>
</div>
</div>
<div class="form-group">
<label>Display Rows:</label>
<div class="row-container" id="rowsContainer"></div>
</div>
<div class="form-group">
<label><input type="checkbox" id="border" name="border" checked>Show Border</label>
</div>
<div class="preview-container">
<div class="preview"></div>
</div>
<button type="submit">Update Display</button>
</form>
</div>
<script>
(function(){const container=document.getElementById('rowsContainer');for(let i=0;i<8;i++){const div=document.createElement('div');div.className='row-group';div.innerHTML="<input type='text' id='row"+i+"' maxlength='30' placeholder='Row "+(i+1)+"' value='' onkeyup='updatePreview()'><select id='fontSize"+i+"' onchange='updatePreview()'><option value='12'>Small (12pt)</option><option value='18' selected>Medium (18pt)</option><option value='24'>Large (24pt)</option></select><button type='button' class='del-btn' onclick='clearRow("+i+")'>DEL</button>";container.appendChild(div);}})();
</script>
</body>
</html>

</content>
